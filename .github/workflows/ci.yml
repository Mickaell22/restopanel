# Push a main -> tests -> imagen a GHCR -> deploy en ksa.
#
# El deploy es un workflow reusable de RestoOps, el repo de infraestructura: es
# quien sabe donde corre el stack.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/mickaell22/restopanel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 13 tests con Vitest via el builder de Angular. El `docker build` de abajo
      # tambien compila el bundle, pero compilar no es lo mismo que verificar:
      # el login y los charts se rompen sin que el compilador diga nada.
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # En un PR se construye sin publicar: si el bundle de Angular no
          # compila, el PR se pone rojo antes de llegar a main.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push'
    uses: Mickaell22/RestoOps/.github/workflows/deploy.yml@main
    secrets: inherit

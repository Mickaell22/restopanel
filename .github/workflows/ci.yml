# Push a main -> imagen a GHCR -> deploy en ksa.
#
# No hay job de tests aparte: el panel no tiene specs propios y el `docker build`
# ya corre `ng build`, que es la verificacion real (compila TypeScript y las
# plantillas). Un job extra de `npm run build` seria la misma compilacion dos
# veces. El deploy es un workflow reusable de RestoOps, el repo de infra.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/mickaell22/restopanel

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # En un PR se construye sin publicar: si el bundle de Angular no
          # compila, el PR se pone rojo antes de llegar a main.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push'
    uses: Mickaell22/RestoOps/.github/workflows/deploy.yml@main
    secrets: inherit

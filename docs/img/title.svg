<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130" fill="none" role="img" aria-label="RestoPanel">
  <text x="410" y="74" text-anchor="middle" font-family="'DejaVu Sans Mono','JetBrains Mono','Consolas',monospace" font-size="52" font-weight="bold" fill="#6366f1" opacity="0">RestoPanel
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- subrayado que se dibuja -->
  <line x1="254" y1="98" x2="566" y2="98" stroke="#6366f1" stroke-width="6" stroke-linecap="round" stroke-dasharray="312" stroke-dashoffset="312">
    <animate attributeName="stroke-dashoffset" from="312" to="0" begin="0.5s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </line>

  <!-- punto final que aterriza -->
  <circle cx="590" cy="98" r="0" fill="#22c55e">
    <!-- keySplines con y<=1: Chromium descarta la animacion entera si el punto
         de control se sale del rango, y el punto se quedaba invisible. -->
    <animate attributeName="r" values="0;11;8" begin="1.6s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.34 1 0.64 1;0.4 0 0.2 1" keyTimes="0;0.7;1"/>
  </circle>
</svg>

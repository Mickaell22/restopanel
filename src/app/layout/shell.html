<ng-template #navList>
  <ul class="nav-list">
    @for (item of navItems; track item.path) {
      <li>
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="nav-link--active"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
        >
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</ng-template>

<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="shell-header">
  <p-button
    class="menu-toggle"
    icon="pi pi-bars"
    severity="secondary"
    [text]="true"
    [rounded]="true"
    ariaLabel="Abrir menu de navegacion"
    (onClick)="menuOpen.set(true)"
  />

  <a class="brand" routerLink="/dashboard">
    <app-brand />
    <span>RestoPanel</span>
  </a>

  <div class="session">
    <!-- El label nombra la accion, no el estado: es lo que un lector de
         pantalla necesita para saber que pasa al pulsarlo. -->
    <p-button
      [icon]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      [ariaLabel]="theme.isDark() ? 'Activar tema claro' : 'Activar tema oscuro'"
      [pTooltip]="theme.isDark() ? 'Tema claro' : 'Tema oscuro'"
      (onClick)="theme.toggle()"
    />

    @if (user(); as currentUser) {
      <span class="session-name">{{ currentUser.name }}</span>
      <p-button
        icon="pi pi-sign-out"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        ariaLabel="Cerrar sesion"
        pTooltip="Cerrar sesion"
        (onClick)="logout()"
      />
    }
  </div>
</header>

<div class="shell-body">
  <nav class="shell-nav" aria-label="Navegacion principal">
    <ng-container [ngTemplateOutlet]="navList" />
  </nav>

  <p-drawer
    header="Navegacion"
    [visible]="menuOpen()"
    (visibleChange)="menuOpen.set($event)"
  >
    <ng-container [ngTemplateOutlet]="navList" />
  </p-drawer>

  <main class="shell-content" id="contenido" tabindex="-1">
    <router-outlet />
  </main>
</div>
